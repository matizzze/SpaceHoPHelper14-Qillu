              [color=#1b487e]░░░░██░░░████░███[/color]
              =============================================
                  ПРИКАЗ О НАЗНАЧЕНИИ ВРИО ГЛАВЫ ОТДЕЛА
              =============================================
              Время от начала смены и дата: ${{time}}, ${{date}}
              Составитель документа: ${{fullName}}
              Должность составителя: Капитан

              Я, [bold][color=#3167bd]${{fullName}}[/color][/bold], в должности [italic][color=#1b487e]Капитан[/color][/italic], в соответствии с положениями [italic][color=SteelBlue]4 пункта "Процедуры назначения ВрИО Главы отдела"[/color][/italic], принимаю следующее решение:

              1. Назначить [italic]временно исполняющим обязанности[/italic] [bold][color=Indigo]Главы ${{department}}[/color][/bold] сотрудника [color=purple][bold]${{fullName}}[/bold][/color], занимающего должность [italic][color=Indigo]${{position}}[/color][/italic] (далее – [italic]назначенный сотрудник[/italic]).

              2. Назначенный сотрудник обязуется следовать Стандартным Рабочим Процедурам и обеспечивать порядок и управление отделом до появления Главы отдела с Центрального Командования.

              3. Назначенный сотрудник принимает на себя ответственность за сохранность вверяемых ему особо ценных предметов и снаряжения.

              4. По прибытии Главы отдела с Центрального Командования назначенный сотрудник обязуется сдать повышенный доступ, особо ценные предметы и снаряжение.

              5. Настоящий приказ вступает в силу с момента его подписания.

              [italic][color=DarkGray]Назначенный сотрудник должен быть уведомлен о своем назначении, а также получить копию данного документа в кратчайшие сроки.
              Внимание! Отказ от выполнения данного приказа может повлечь за собой ответственность согласно 142 статье Корпоративного Закона и возможное увольнение сотрудника.[/italic][/color]

