          templates:
          - title: Приказ капитана о принудительном назначении главы отдела
            template: |-
              [color=#1b487e]███░███░░░░██░░░░[/color]
              [color=#1b487e]░██░████░░░██░░░░[/color]        [head=3]Бланк документа[/head]
              [color=#1b487e]░░█░██░██░░██░█░░[/color]                [head=3]NanoTrasen[/head]
