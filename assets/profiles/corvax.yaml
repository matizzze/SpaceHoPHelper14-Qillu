              При вступлении в должность обязуюсь следовать Стандартным Рабочим Процедурам и до появления Капитана с Центрального Командования обеспечивать порядок и управление станцией, обеспечивать сохранность вверяемых мне особо ценных предметов и снаряжения.

              По прибытии Капитана с Центрального Командования обязуюсь сдать повышенный доступ, особо ценные предметы и снаряжение.

